<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediRoute — AI-Powered Emergency Healthcare Platform. Find the nearest hospital with available beds in seconds. Real-time bed tracking, ambulance dispatch, and AI-driven hospital recommendations.">
  <meta name="keywords" content="emergency healthcare, hospital finder, bed availability, ambulance tracking, AI healthcare, India, PMJAY">
  <meta name="author" content="MediRoute">
  <meta name="theme-color" content="#00E6B8">

  <title>MediRoute — AI-Powered Emergency Healthcare</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet.js for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Stylesheets with Cache Busting -->
  <link rel="stylesheet" href="css/variables.css?v=230">
  <link rel="stylesheet" href="css/base.css?v=230">
  <link rel="stylesheet" href="css/components.css?v=230">
  <link rel="stylesheet" href="css/pages.css?v=230">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏥</text></svg>">

  <style>
    /* Critical Header Flex & Canvas Rules */
    body { margin: 0; padding: 0; background: #070a12; color: #f1f2f6; font-family: 'Inter', sans-serif; overflow-x: hidden; width: 100vw; }
    .app { display: flex; flex-direction: column; width: 100vw; min-height: 100vh; overflow-x: hidden; }
    .app-header { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; z-index: 9999 !important; height: 64px !important; width: 100vw !important; display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: space-between !important; padding: 0 1.25rem !important; background: rgba(7, 10, 18, 0.98) !important; border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important; box-sizing: border-box !important; backdrop-filter: blur(25px) !important; }
    .header-brand { display: flex !important; flex-direction: row !important; align-items: center !important; gap: 0.5rem !important; cursor: pointer !important; flex-shrink: 0 !important; }
    .brand-logo-text { font-family: 'Outfit', sans-serif !important; font-size: 1.25rem !important; font-weight: 900 !important; color: #f1f2f6 !important; }
    .brand-logo-text span { color: #00E6B8 !important; }
    .top-nav-tabs { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; gap: 0.5rem !important; margin: 0 1rem !important; padding: 4px 0 !important; }
    .top-nav-icon-btn { width: 38px !important; height: 38px !important; border-radius: 50% !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; font-size: 1.15rem !important; color: #a4b0c3 !important; background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; cursor: pointer !important; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important; user-select: none !important; position: relative !important; }
    .top-nav-icon-btn:hover { color: #ffffff !important; background: rgba(0, 230, 184, 0.15) !important; border-color: rgba(0, 230, 184, 0.4) !important; transform: translateY(-2px) !important; box-shadow: 0 4px 12px rgba(0, 230, 184, 0.2) !important; }
    .top-nav-icon-btn.active { color: #00E6B8 !important; background: rgba(0, 230, 184, 0.2) !important; border-color: #00E6B8 !important; font-weight: 700 !important; box-shadow: 0 0 16px rgba(0, 230, 184, 0.35) !important; }
    .nav-divider { width: 1px !important; height: 22px !important; background: rgba(255, 255, 255, 0.15) !important; margin: 0 4px !important; }
    .header-tools { display: flex !important; flex-direction: row !important; align-items: center !important; gap: 0.85rem !important; flex-shrink: 0 !important; }
    .app__main { flex: 1 !important; width: 100vw !important; margin-top: 64px !important; padding: 0 !important; box-sizing: border-box !important; overflow-x: hidden !important; display: flex !important; flex-direction: column !important; }
    .app__content { width: 100% !important; max-width: 1380px !important; margin: 0 auto !important; padding: 1.5rem 1.25rem !important; box-sizing: border-box !important; min-width: 0 !important; }
    .leaflet-container { background: var(--bg-secondary) !important; }
    .leaflet-popup-content-wrapper { background: var(--bg-elevated) !important; color: var(--text-primary) !important; border: 1px solid var(--glass-border) !important; border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; }
    .leaflet-popup-tip { background: var(--bg-elevated) !important; border: 1px solid var(--glass-border) !important; }
    .leaflet-popup-close-button { color: var(--text-muted) !important; }
    .leaflet-control-zoom a { background: var(--bg-elevated) !important; color: var(--text-primary) !important; border-color: var(--glass-border) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg-surface) !important; }
    .custom-marker { background: none !important; border: none !important; }
    .route-line { animation: pulse 2s infinite; }
  </style>
</head>
<body>

  <!-- Pristine App Shell -->
  <div class="app">
    <!-- Widescreen Top Navigation Header -->
    <header class="app-header">
      <div class="header-brand" onclick="window.location.hash='landing'">
        <span class="brand-logo-icon">🏥</span>
        <span class="brand-logo-text">Medi<span>Route</span></span>
      </div>

      <!-- Sleek Compact Circular Navigation Icon Bar -->
      <nav class="top-nav-tabs">
        <button class="top-nav-icon-btn active" data-page="landing" onclick="window.MediRoute.app.navigateTo('landing')" title="🏠 Home Landing Dashboard">🏠</button>
        <button class="top-nav-icon-btn" data-page="emergency" onclick="window.MediRoute.app.navigateTo('emergency')" title="🚨 Emergency Hospital Finder">🚨</button>
        <button class="top-nav-icon-btn" data-page="intake" onclick="window.MediRoute.app.navigateTo('intake')" title="🤖 AI Clinical Intake & Voice Triage">🤖</button>
        <button class="top-nav-icon-btn" data-page="doctor-triage" onclick="window.MediRoute.app.navigateTo('doctor-triage')" title="👨‍⚕️ Doctor 30-Sec Triage Review">👨‍⚕️</button>
        <button class="top-nav-icon-btn" data-page="dashboard" onclick="window.MediRoute.app.navigateTo('dashboard')" title="🏥 Hospital Bed & ICU Live Dashboard">🏥</button>
        <button class="top-nav-icon-btn" data-page="ambulance" onclick="window.MediRoute.app.navigateTo('ambulance')" title="🚑 Ambulance Tracker & Dispatch">🚑</button>
        <button class="top-nav-icon-btn" data-page="patient" onclick="window.MediRoute.app.navigateTo('patient')" title="👤 Patient Portal & ABDM Health Pass">👤</button>
        <div class="nav-divider"></div>
        <button class="top-nav-icon-btn" data-page="ayush" onclick="window.MediRoute.app.navigateTo('ayush')" title="🌿 AYUSH Traditional Medicine Mode">🌿</button>
        <button class="top-nav-icon-btn" data-page="admin" onclick="window.MediRoute.app.navigateTo('admin')" title="⚙️ System Admin & Analytics">⚙️</button>
      </nav>

      <div class="header-tools">
        <div style="position: relative;" id="notification-container">
          <button class="icon-btn" id="notifications-btn" title="Notifications">
            🔔
            <span class="badge-dot" id="notification-count">4</span>
          </button>
          <div id="notification-dropdown" class="card card--glass" style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 320px; z-index: 1000; padding: 12px; flex-direction: column; gap: 8px;">
            <div style="font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);">🚨 Emergency Dispatch: AMB-102 assigned to Saket (2 mins ago)</div>
            <div style="font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);">🛏️ ICU Bed Update: AIIMS added 5 ICU beds (8 mins ago)</div>
            <div style="font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);">⚠️ Blood Bank Alert: Max Healthcare requested O- Blood (20 mins ago)</div>
            <div style="font-size: 12px;">✅ System Alert: All 48 emergency centers online</div>
          </div>
        </div>
        <button class="icon-btn" id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        <div class="avatar-pill" onclick="window.location.hash='patient'" title="Patient Profile">AM</div>
      </div>
    </header>

    <!-- Main Application Canvas Area (100% Width Below Top Navbar) -->
    <main class="app__main">
      <div class="app__content" id="app-content">
        <div class="flex-center" style="height: 60vh;">
          <div class="spinner spinner--lg"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Global SOS Floating Button -->
  <button class="sos-fab" id="sos-fab" title="EMERGENCY SOS">SOS</button>

  <!-- Core Data & Helper Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>

  <!-- SIH PS 26047 AI & Clinical Engine -->
  <script src="js/ai-engine.js"></script>

  <!-- Page Controllers -->
  <script src="js/pages/landing.js"></script>
  <script src="js/pages/emergency.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/ambulance.js"></script>
  <script src="js/pages/patient.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/intake.js"></script>
  <script src="js/pages/doctor-triage.js"></script>
  <script src="js/pages/ayush.js"></script>

  <!-- App Entrypoint -->
  <script src="js/app.js"></script>
</body>
</html>
