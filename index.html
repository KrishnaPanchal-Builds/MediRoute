<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediRoute — AI-Powered Emergency Healthcare Platform. Find the nearest hospital with available beds in seconds. Real-time bed tracking, ambulance dispatch, and AI-driven hospital recommendations.">
  <meta name="keywords" content="emergency healthcare, hospital finder, bed availability, ambulance tracking, AI healthcare, India, PMJAY">
  <meta name="author" content="MediRoute">
  <meta name="theme-color" content="#00E6B8">

  <title>MediRoute — AI-Powered Emergency Healthcare</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet.js for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏥</text></svg>">

  <style>
    /* Critical inline map overrides */
    .leaflet-container { background: var(--bg-secondary) !important; }
    .leaflet-popup-content-wrapper { background: var(--bg-elevated) !important; color: var(--text-primary) !important; border: 1px solid var(--glass-border) !important; border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; }
    .leaflet-popup-tip { background: var(--bg-elevated) !important; border: 1px solid var(--glass-border) !important; }
    .leaflet-popup-close-button { color: var(--text-muted) !important; }
    .leaflet-control-zoom a { background: var(--bg-elevated) !important; color: var(--text-primary) !important; border-color: var(--glass-border) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg-surface) !important; }
    .custom-marker { background: none !important; border: none !important; }
    .route-line { animation: pulse 2s infinite; }
  </style>
</head>
<body>

  <!-- Pristine App Shell -->
  <div class="app">
    <!-- Widescreen Top Navigation Header -->
    <header class="app-header">
      <div class="header-brand" onclick="window.location.hash='landing'">
        <span class="brand-logo-icon">🏥</span>
        <span class="brand-logo-text">Medi<span>Route</span></span>
      </div>

      <!-- Visible Navigation Tabs with Icons -->
      <nav class="top-nav-tabs">
        <button class="top-nav-tab active" data-page="landing"><span class="tab-icon">🏠</span> Home</button>
        <button class="top-nav-tab" data-page="emergency"><span class="tab-icon">🚨</span> Emergency</button>
        <button class="top-nav-tab" data-page="intake"><span class="tab-icon">🤖</span> AI Intake</button>
        <button class="top-nav-tab" data-page="doctor-triage"><span class="tab-icon">👨‍⚕️</span> Doctor Portal</button>
        <button class="top-nav-tab" data-page="dashboard"><span class="tab-icon">🏥</span> Dashboard</button>
        <button class="top-nav-tab" data-page="ambulance"><span class="tab-icon">🚑</span> Ambulances</button>
        <button class="top-nav-tab" data-page="patient"><span class="tab-icon">👤</span> Patient Portal</button>
        <button class="top-nav-tab" data-page="ayush"><span class="tab-icon">🌿</span> AYUSH</button>
        <button class="top-nav-tab" data-page="admin"><span class="tab-icon">⚙️</span> Admin</button>
      </nav>

      <div class="header-tools">
        <div style="position: relative;" id="notification-container">
          <button class="icon-btn" id="notifications-btn" title="Notifications">
            🔔
            <span class="badge-dot" id="notification-count">4</span>
          </button>
          <div id="notification-dropdown" class="card card--glass" style="display: none; position: absolute; right: 0; top: 100%; margin-top: 8px; width: 320px; z-index: 1000; padding: 12px; flex-direction: column; gap: 8px;">
            <div style="font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);">🚨 Emergency Dispatch: AMB-102 assigned to Saket (2 mins ago)</div>
            <div style="font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);">🛏️ ICU Bed Update: AIIMS added 5 ICU beds (8 mins ago)</div>
            <div style="font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border);">⚠️ Blood Bank Alert: Max Healthcare requested O- Blood (20 mins ago)</div>
            <div style="font-size: 12px;">✅ System Alert: All 48 emergency centers online</div>
          </div>
        </div>
        <button class="icon-btn" id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        <div class="avatar-pill" onclick="window.location.hash='patient'" title="Patient Profile">AM</div>
      </div>
    </header>

    <!-- Main Application Canvas Area (100% Width Below Top Navbar) -->
    <main class="app__main">
      <div class="app__content" id="app-content">
        <div class="flex-center" style="height: 60vh;">
          <div class="spinner spinner--lg"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Global SOS Floating Button -->
  <button class="sos-fab" id="sos-fab" title="EMERGENCY SOS">SOS</button>

  <!-- Core Data & Helper Scripts -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>

  <!-- SIH PS 26047 AI & Clinical Engine -->
  <script src="js/ai-engine.js"></script>

  <!-- Page Controllers -->
  <script src="js/pages/landing.js"></script>
  <script src="js/pages/emergency.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/ambulance.js"></script>
  <script src="js/pages/patient.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/intake.js"></script>
  <script src="js/pages/doctor-triage.js"></script>
  <script src="js/pages/ayush.js"></script>

  <!-- App Entrypoint -->
  <script src="js/app.js"></script>
</body>
</html>
